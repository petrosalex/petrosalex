<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Глубокий космический градиент для фона -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Свечение для текста и крупных звезд -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Градиент для хвоста падающей звезды -->
    <linearGradient id="comet-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#space-bg); rx: 12px; }
    .star { fill: #ffffff; }
    .star circle { transform-box: fill-box; transform-origin: center; }
    
    /* Анимации мерцания звезд с разным временем и задержкой */
    .t1 { animation: twinkle 3s infinite ease-in-out; }
    .t2 { animation: twinkle 4.5s infinite ease-in-out 1.2s; }
    .t3 { animation: twinkle 6s infinite ease-in-out 2.5s; }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Анимация падающей звезды (раз в 7 секунд) */
    .comet {
      animation: shoot 7s infinite ease-in;
      opacity: 0;
    }

    @keyframes shoot {
      0% { transform: translate(900px, -50px) rotate(-35deg); opacity: 0; }
      5% { opacity: 1; }
      20% { transform: translate(200px, 400px) rotate(-35deg); opacity: 0; }
      100% { transform: translate(200px, 400px) rotate(-35deg); opacity: 0; }
    }

    /* Стили главного текста */
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 4px;
      filter: url(#glow);
    }

    /* Стили подписи */
    .subtitle {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 19px;
      fill: #58a6ff;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Фон баннера -->
  <rect width="1200" height="350" class="bg" />

  <!-- Мерцающие и статичные звезды -->
  <g class="star">
    <circle cx="80" cy="50" r="1.5" class="t1" />
    <circle cx="210" cy="120" r="1" class="t2" />
    <circle cx="340" cy="40" r="2" class="t3" />
    <circle cx="480" cy="280" r="1.2" class="t1" />
    <circle cx="620" cy="70" r="1.8" class="t2" />
    <circle cx="770" cy="290" r="1" class="t3" />
    <circle cx="890" cy="90" r="2.2" class="t1" filter="url(#glow)" />
    <circle cx="1050" cy="60" r="1.4" class="t2" />
    <circle cx="1130" cy="240" r="1.8" class="t3" />
    <circle cx="150" cy="270" r="2" class="t2" filter="url(#glow)" />
    <circle cx="960" cy="210" r="1.2" class="t1" />
    <circle cx="420" cy="160" r="0.8" opacity="0.4" />
    <circle cx="710" cy="190" r="0.8" opacity="0.5" />
    <circle cx="530" cy="95" r="1" opacity="0.3" />
    <circle cx="290" cy="220" r="1.5" class="t3" />
  </g>

  <!-- Падающая звезда -->
  <g class="comet">
    <rect x="0" y="0" width="140" height="2" fill="url(#comet-trail)" rx="1" />
    <circle cx="0" cy="1" r="2.5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Текст и Слоган -->
  <text x="50%" y="46%" text-anchor="middle" class="title">PETROSALEX</text>
  <text x="50%" y="62%" text-anchor="middle" class="subtitle">> To engineering... and beyond! _</text>
</svg>